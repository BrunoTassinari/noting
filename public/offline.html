<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16171b">
<title>Sem conexão · Noting</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #16171b; color: #dcdee4; padding: 24px; box-sizing: border-box;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
  }
  .card { max-width: 340px; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { margin: 20px 0 8px; font-size: 20px; font-weight: 600; color: #fff; }
  p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #8d92a0; }
  button {
    height: 44px; padding: 0 20px; border: 0; border-radius: 10px; cursor: pointer;
    background: #7fd1c4; color: #101114; font-family: inherit; font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>O Noting precisa de internet para abrir suas notas. Confira a conexão e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
